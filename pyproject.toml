[project]
name = "book-to-podcast"
version = "0.1.0"
description = "将图书内容转换为双人对话式播客音频"
authors = [{name = "HandFoot Company", email = "bai@handfoot.com"}]
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
book2podcast = "src.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]